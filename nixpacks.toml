[phases.setup]
nixPkgs = ["php81", "php81Extensions.pdo", "php81Extensions.pdo_mysql", "php81Extensions.mbstring", "php81Extensions.tokenizer", "php81Extensions.xml", "php81Extensions.ctype", "php81Extensions.fileinfo", "composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = ["php artisan config:cache", "php artisan route:cache"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
```

**Then in Railway go to Variables tab and add these:**
```
APP_NAME=GestionAdministrative
APP_ENV=production
APP_DEBUG=false
APP_KEY=  (generate this with php artisan key:generate --show)
DB_CONNECTION=mysql
